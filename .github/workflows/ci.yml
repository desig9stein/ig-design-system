name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the tokens and run every check
        run: npm test
      - name: Generated files are committed and up to date
        run: git diff --exit-code -- dist docs
